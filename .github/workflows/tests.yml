name: casks
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # In a homebrew-* repository this checks out the repo and links it
      # into Homebrew as the ro-tex/tap tap.
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - run: brew style ro-tex/tap

      - run: brew audit --cask --strict --online --tap ro-tex/tap

      - name: Install each cask
        run: |
          for cask in Casks/*.rb; do
            name="ro-tex/tap/$(basename "$cask" .rb)"
            brew install --cask "$name"
            brew uninstall --cask "$name"
          done
